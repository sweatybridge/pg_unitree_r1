name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]

    steps:
      - name: Check out Unitree SDK2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unitreerobotics/unitree_sdk2
          ref: 9754cd153af3da471b0fe5f3aa535e426fb11db3
          path: unitree_sdk2
          persist-credentials: false

      - name: Check out pg_unitree_r1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: unitree_sdk2/pg_unitree_r1
          persist-credentials: false

      - name: Build PostgreSQL extension
        working-directory: unitree_sdk2
        run: >-
          docker build
          --build-arg PG_MAJOR=${{ matrix.postgres }}
          --file pg_unitree_r1/Dockerfile
          --tag pg-unitree-r1-ci:${{ matrix.postgres }}
          .

      - name: Run native, SQL, and worker smoke tests
        working-directory: unitree_sdk2
        run: ./pg_unitree_r1/tests/ci.sh pg-unitree-r1-ci:${{ matrix.postgres }} ${{ matrix.postgres }}
