name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pg_unitree_r1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PostgreSQL extension
        run: >-
          docker build
          --build-arg PG_MAJOR=18
          --file Dockerfile
          --tag pg-unitree-r1-ci:18
          .

      - name: Run native, SQL, and worker smoke tests
        run: ./tests/ci.sh pg-unitree-r1-ci:18 18
